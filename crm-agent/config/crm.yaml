provider: hubspot
api_via: mcp
connector_name: HubSpot # portal accountId 45013420, confirmed reachable via mcp__HubSpot__*

object_mapping:
  contact_object: contacts
  company_object: companies
  deal_object: deals

field_mapping:
  email: email
  phone: phone
  job_title: jobtitle
  company_name: company
  custom_decay_score: # not yet created in HubSpot -- add a custom Number contact
    # property (e.g. internal name "decay_score") in Settings > Properties,
    # then set this to that internal name.

write_rules:
  preserve_history: true
  never_overwrite_manual_overrides: true
  never_touch_fields:
    - lifecycle_stage
    - lead_source
