provider: hubspot
api_via: mcp
connector_name: HubSpot # portal accountId 45013420, confirmed reachable via mcp__HubSpot__*

object_mapping:
  contact_object: contacts
  company_object: companies
  deal_object: deals

field_mapping:
  email: email
  phone: phone
  job_title: jobtitle
  company_name: company
  custom_decay_score: # intentionally not synced to HubSpot; tracked internally only

write_rules:
  preserve_history: true
  never_overwrite_manual_overrides: true
  never_touch_fields:
    - lifecycle_stage
    - lead_source
